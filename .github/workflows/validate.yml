name: Build and validate v0.3.1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip release-build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct the complete LaTeX source
        run: cat paper/source_parts/main.tex.part* > paper/main.tex
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build mathematical results, figures, and PDFs
        run: python scripts/run_all.py
      - name: Regenerate immutable release manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest = {}
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name == 'MANIFEST_SHA256.json':
                  continue
              if any(part in {'.git', '.pytest_cache', '__pycache__'} for part in p.parts):
                  continue
              if p.suffix in {'.aux', '.log', '.out', '.toc', '.pyc', '.fls', '.fdb_latexmk'}:
                  continue
              manifest[p.as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          Path('MANIFEST_SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          python verify_manifest.py
      - name: Commit generated release artifacts
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build v0.3.1 release artifacts [skip release-build]'
            git push
          fi
